name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --locked          # fails if uv.lock is out of date with pyproject.toml

      - name: Test
        run: uv run pytest             # an in-memory MongoDB (mongomock), so no service is needed
