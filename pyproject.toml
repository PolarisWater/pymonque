[project]
name = "pymonque"
version = "3.1.0"
description = "a typed MongoDB layer for an application, with work on top: tasks, schedulers and piles"
readme = "README.md"
authors = [
    { name = "PolarisWater" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
